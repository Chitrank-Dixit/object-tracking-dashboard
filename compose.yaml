services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    volumes:
      - .:/app:Z
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
    ports:
      - "8501:8501"
    command: [
      "uv", "run", "streamlit", "run", "app.py",
      "--server.port=8501",
      "--server.address=0.0.0.0",
      "--server.headless=true"
    ]
